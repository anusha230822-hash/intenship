<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Function Calling Another Function </title>
</head>
<body>
    <script>
        function add(a, b)
         {
             return a + b;
             }
              function display()
               {
                 let result = add(60, 20);
                  console.log(result);
                 }
         display(); 
    </script>
    
</body>
</html>
