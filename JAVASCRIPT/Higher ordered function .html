<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Higher ordered function</title>
</head>
<body>
    <script>
        function calculate(operation)
         {
             return operation(80, 20);
             }
              let result = calculate((a, b) => a + b); 
        console.log(result); 
    </script>
</body>
</html>
