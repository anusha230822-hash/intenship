<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korean Skincare</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<style>
body{
    background:#f5f1ed;
    font-family: Georgia, serif;
}

.hero-section{
    padding:50px 0;
}

.logo{
    font-size:50px;
    font-weight:bold;
    color:#2d2018;
}

.nav-link{
    color:#2d2018 !important;
    font-size:13px;
    text-transform:uppercase;
    margin:0 10px;
}

.main-title{
    font-size:72px;
    font-weight:bold;
    color:#b07a58;
    letter-spacing:4px;
    line-height:1;
}

.care-title{
    font-size:72px;
    font-weight:bold;
    color:#b07a58;
    letter-spacing:4px;
    margin-top:20px;
}

.small-text{
    font-size:20px;
    color:#333;
    margin-top:20px;
    max-width:320px;
    line-height:1.4;
}

.gallery img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.right-image{
    height:650px;
    width:100%;
    object-fit:cover;
}

.product-box{
    margin-top:30px;
}
.block1{
    width:100%;
    height:100vh;
    background-color:#f4ccea;
    margin-top:500px;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    
    height:100vh;
    background:#e9e9e9;
    font-family:Arial, sans-serif;
}

.container{
    position:relative;
    width:500px;
    height:500px;
}

.center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:200px;
    height:200px;
    border-radius:50%;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#d3001c;
    border:15px solid #f5f5f5;
}

.item{
    position:absolute;
    width:110px;
    height:110px;
    border-radius:50%;
    background:white;
    border:8px solid #f5f5f5;
    overflow:hidden;
}

.item img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Top */
.top{
    top:20px;
    left:50%;
    transform:translateX(-50%);
}

/* Right */
.right{
    top:50%;
    right:20px;
    transform:translateY(-50%);
}

/* Bottom Right */
.bottom-right{
    bottom:40px;
    right:70px;
}

/* Bottom Left */
.bottom-left{
    bottom:40px;
    left:70px;
}

/* Left */
.left{
    top:50%;
    left:20px;
    transform:translateY(-50%);
}

/* Connecting Lines */
.line{
    position:absolute;
    background:white;
    z-index:-1;
}

.line1{
    width:15px;
    height:90px;
    top:120px;
    left:50%;
    transform:translateX(-50%);
}

.line2{
    width:90px;
    height:15px;
    top:50%;
    right:120px;
}

.line3{
    width:90px;
    height:15px;
    top:50%;
    left:120px;
}

.line4{
    width:15px;
    height:90px;
    bottom:120px;
    left:40%;
}

.line5{
    width:15px;
    height:90px;
    bottom:120px;
    right:40%;
}
</style>
</head>
<body>

<div class="container hero-section">

    <div class="row align-items-center">

        <!-- Left Side -->
        <div class="col-lg-7">

            <div class="d-flex justify-content-between align-items-center mb-5">

                <div class="logo">HS</div>

                <nav>
                    <a href="#" class="nav-link d-inline">ABOUT US</a>
                    <a href="#" class="nav-link d-inline">PRODUCTS</a>
                    <a href="#" class="nav-link d-inline">CONTACTS</a>
                </nav>

            </div>

            <h1 class="main-title">KOREAN</h1>

            <div class="row gallery product-box">

                <div class="col-4">
                    <img src="https://images.unsplash.com/photo-1556228578-8c89e6adf883?w=500" alt="Korean Skincare">
                </div>

                <div class="col-4">
                    <img src="https://images.unsplash.com/photo-1487412947147-5cebf100ffc2?w=500" alt="Korean Skincare">
                </div>

                <div class="col-4">
                    <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500" alt="Korean Skincare">
                </div>

            </div>

            <div class="row align-items-end mt-4">

                <div class="col-md-6">
                    <p class="small-text">
                        Korean cosmetics are famous for their natural
                        compositions all over the world.
                    </p>
                </div>

                <div class="col-md-6">
                    <h2 class="care-title">CARE</h2>
                </div>

            </div>

        </div>

        <!-- Right Side -->
        <div class="col-lg-5">
            <img src="korean.jpg" class="right-image" alt="">
        </div>

    </div>
    
</div>
<div class="block1">
    <div class="container">

    <div class="line line1"></div>
    <div class="line line2"></div>
    <div class="line line3"></div>
    <div class="line line4"></div>
    <div class="line line5"></div>

    <div class="center">
        A<br>
        K-GUIDE<br>
        TO<br>
        K-BEAUTY
    </div>

    <div class="item top">
        <img src="girl1.jpg" alt="">
    </div>

    <div class="item right">
        <img src="boy.jpg" alt="">
    </div>

    <div class="item bottom-right">
        <img src="makeup.jpg" alt="">
    </div>

    <div class="item bottom-left">
        <img src="girl2.jpg" alt="">
    </div>

    <div class="item left">
        <img src="heart.jpg" alt="">
    </div>

</div>

</div>
</body>
     </html>
