<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Nested Functions </title>
</head>
<body>
    <script>
        function outer() 
        { 
            function inner() 
            { 
                console.log("Inner function");
             } 
             inner();
             }
         outer(); 
    </script>
</body>
</html>
