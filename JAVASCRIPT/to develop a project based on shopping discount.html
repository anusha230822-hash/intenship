<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Discount</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            width: 320px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            background: #ff9800;
            color: white;
            border: none;
            cursor: pointer;
        }
        #result {
            margin-top: 10px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Shopping Discount</h2>
        <input id="amount" type="number" placeholder="Enter purchase amount">
        <button onclick="calculateDiscount()">Check Discount</button>
        <div id="result"></div>
    </div>

    <script>
        function calculateDiscount() {
            const amount = parseFloat(document.getElementById("amount").value);
            const resultBox = document.getElementById("result");

            if (isNaN(amount) || amount <= 0) {
                resultBox.innerText = "Please enter a valid positive amount.";
                return;
            }

            if (amount > 30000) {
                const discount = amount * 0.20;
                const finalAmount = amount - discount;
                resultBox.innerText = `You get a 20% discount. Final amount: ${finalAmount.toFixed(2)}`;
            } else if (amount > 5000) {
                const discount = amount * 0.10;
                const finalAmount = amount - discount;
                resultBox.innerText = `You get a 10% discount. Final amount: ${finalAmount.toFixed(2)}`;
            } else {
                resultBox.innerText = "No discount available for purchases below or equal to 5000.";
            }
        }
    </script>
</body>
</html>
