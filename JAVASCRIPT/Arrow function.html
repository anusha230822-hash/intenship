<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function</title>
</head>
<body>
    <script>
        const add = (a, b) => { return a + b; }; 
        // Call:
         console.log(add(10, 20)); 
    </script>
