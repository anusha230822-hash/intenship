<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Market Billing App</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f6f9;
}

.container-box{
    max-width:900px;
    margin:30px auto;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    color:#0d6efd;
    margin-bottom:20px;
}

table{
    margin-top:20px;
}

.total-box{
    text-align:right;
    font-size:24px;
    font-weight:bold;
    color:green;
    margin-top:20px;
}

.btn-remove{
    background:red;
    color:white;
}
</style>
</head>
<body>

<div class="container">
    <div class="container-box">

        <h2>🛒 Super Market Billing App</h2>

        <div class="row g-3">

            <div class="col-md-4">
                <input type="text" id="itemName" class="form-control" placeholder="Item Name">
            </div>

            <div class="col-md-3">
                <input type="number" id="price" class="form-control" placeholder="Price">
            </div>

            <div class="col-md-3">
                <input type="number" id="qty" class="form-control" placeholder="Quantity">
            </div>

            <div class="col-md-2">
                <button class="btn btn-primary w-100" onclick="addItem()">Add</button>
            </div>

        </div>

        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Item</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="billTable">
            </tbody>
        </table>

        <div class="total-box">
            Grand Total: ₹ <span id="grandTotal">0</span>
        </div>

        <div class="text-center mt-4">
            <button class="btn btn-success" onclick="printBill()">
                Print Bill
            </button>
        </div>

    </div>
</div>

<script>

let grandTotal = 0;

function addItem(){

    let item = document.getElementById("itemName").value;
    let price = parseFloat(document.getElementById("price").value);
    let qty = parseInt(document.getElementById("qty").value);

    if(item === "" || isNaN(price) || isNaN(qty)){
        alert("Please fill all fields");
        return;
    }

    let total = price * qty;

    grandTotal += total;

    let row = `
    <tr>
        <td>${item}</td>
        <td>₹${price}</td>
        <td>${qty}</td>
        <td>₹${total}</td>
        <td>
            <button class="btn btn-danger btn-sm"
            onclick="removeItem(this, ${total})">
            Delete
            </button>
        </td>
    </tr>
    `;

    document.getElementById("billTable").innerHTML += row;

    document.getElementById("grandTotal").innerText = grandTotal;

    document.getElementById("itemName").value="";
    document.getElementById("price").value="";
    document.getElementById("qty").value="";
}

function removeItem(btn,total){

    btn.parentElement.parentElement.remove();

    grandTotal -= total;

    document.getElementById("grandTotal").innerText = grandTotal;
}

function printBill(){
    window.print();
}

</script>

</body>
</html>
