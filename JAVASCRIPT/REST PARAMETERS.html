<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rest parameters</title>
</head>
<body>
    <script>
        function add(...numbers) 
        {  
            let total = 0; 
             for (let number of numbers)
              { 
                 total += number; 

               }  return total; 
             } 
              console.log(add(10, 20)); 
               console.log(add(10, 20, 30)); 
         
    </script>
</body>
</html>
