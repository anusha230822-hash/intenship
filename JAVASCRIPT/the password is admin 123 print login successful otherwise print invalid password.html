<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IF TEMPERATURE IS GREATER THAN 40 PRINT TO HOT OTHERWISE PRINT INVALID PASSWORD</title>
</head>
<body>
    <script>
        function checkTemperature() {
            const temperature = parseFloat(prompt("Enter the temperature:"));
            if (temperature > 40) {
                alert("It's too hot!");
            } else {
                alert("Invalid temperature");
            }
        }
        checkTemperature();
    </script>
    
</body>
</html>
