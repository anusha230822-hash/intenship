<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI CATEGORY</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            width: 320px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        #result {
            margin-top: 10px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>BMI Category</h2>
        <input id="weight" type="number" placeholder="Enter weight (kg)">
        <input id="height" type="number" placeholder="Enter height (m)">
        <button onclick="calculateBMI()">Check BMI</button>
        <div id="result"></div>
    </div>

    <script>
        function calculateBMI() {
            const weight = parseFloat(document.getElementById("weight").value);
            const height = parseFloat(document.getElementById("height").value);
            const resultBox = document.getElementById("result");

            if (isNaN(weight) || isNaN(height) || weight <= 0 || height <= 0) {
                resultBox.innerText = "Please enter valid positive values.";
                return;
            }

            const bmi = weight / (height * height);

            if (bmi < 18.5) {
                resultBox.innerText = `Your BMI is ${bmi.toFixed(2)}. You are underweight.`;
            } else if (bmi < 25) {
                resultBox.innerText = `Your BMI is ${bmi.toFixed(2)}. You have a normal weight.`;
            } else if (bmi < 30) {
                resultBox.innerText = `Your BMI is ${bmi.toFixed(2)}. You are overweight.`;
            } else {
                resultBox.innerText = `Your BMI is ${bmi.toFixed(2)}. You are obese.`;
            }
        }
    </script>
</body>
</html>
