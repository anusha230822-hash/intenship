<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursive function</title>
</head>
<body>
    <script>
        function count(n)
         {
              if (n === 0) 
              {  return;  }
                console.log(n);
                  count(n - 1);  }
          count(10); 
    </script>
</body>
</html>
