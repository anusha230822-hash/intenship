<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
</head>
<body>
    <script>
     var name = "Anusha";
     console.log(name);
     var name = "Anu";
     console.log(name);
     name = "yashu";
     console.log(name);
     let age = 23;
     console.log(age);
     age = 15;
     console.log(age);
     const pi = 3.14;
     console.log(pi);
     pi = 3.14159; 
     console.log(pi);
   </script> 
</body>
    
</html>
