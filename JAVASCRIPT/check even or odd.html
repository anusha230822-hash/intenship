<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVEN OR ODD</title>
</head>
<body>
    <script>
        function checkEvenOdd() {
            const number = parseInt(prompt("Enter a number:"));
            if (number % 2 === 0) {
                alert("The number is even.");
            } else {
                alert("The number is odd.");
            }
        }
        checkEvenOdd();
    </script>
    
</body>
</html>
